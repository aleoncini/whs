<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Andrea Leoncini, based on Bootstrap contributors">
  <title>WHS - Results</title>

  <!-- Bootstrap core CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

  <!-- App specific CSS -->
  <link href="css/whs.css" rel="stylesheet">

  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="img/golfball_transp.png" />

</head>

<body style="padding-top: 3.5rem">

    <div class="col-lg-8 mx-auto p-4 py-md-5">

        <header class="d-flex align-items-center pb-3 mb-5 border-bottom">
            <a href="https://www.federgolf.it/news/world-handicap-system-attivo-in-italia/"
                class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <span class="fs-4"><img src="img/golfball_transp.png" width="32" height="32"><img src="img/transparent_spacer.png" width="16" height="32">World Handicap System</span>
            </a>
        </header>

        <main>
            <h1 class="text-body-emphasis">I risultati che hai caricato</h1>
            <div class="mb-5">
                <a href="./index.html" class="btn btn-light" role="button">&laquo; Home</a>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#scoreForm">
                    Aggiungi gara
                </button>
            </div>
            <hr class="col-3 col-md-2 mb-5">
            <div class="alert alert-danger" id="formNotComplete" role="alert" style="display:none;"></div>
            <table class="table table-condensed table-hover table-sm" id="tbl_results">
                <thead>
                    <tr class="tb_header"><th>Data</th><th>Campo</th><th>Gara</th><th>STB</th><th>SD</th><th>&nbsp;</th></tr>
                </thead>
                <tbody id="scoresTableBody">
                </tbody>
            </table>
        </main>

    </div>

<!-- Modal form to collect data about a single Tournament -->
<div class="modal fade" id="scoreForm" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Aggiungi il risultato di una gara</h5>
            </div>
            <div class="modal-body">
                <p>Il valore relativo allo <b>Score Differential (SD)</b> lo trovi sul sito della Federgolf nella sezione risultati.</p>
                <div class="mb-3">
                    <label for="dateInput" class="form-label">Data della gara</label>
                    <input type="date" class="form-control" id="dateInput">
                </div>
                <div class="mb-3">
                    <label for="courseInput" class="form-label">Campo</label>
                    <input type="text" class="form-control" id="courseInput">
                </div>
                <div class="mb-3">
                    <label for="tournamentInput" class="form-label">Gara</label>
                    <input type="text" class="form-control" id="tournamentInput">
                </div>
                <div class="mb-3">
                    <label for="stbInput" class="form-label">Risultato Stableford</label>
                    <input type="text" class="form-control" id="stbInput">
                </div>
                <div class="mb-3">
                    <label for="sdInput" class="form-label">Score Differential (SD)</label>
                    <input type="text" class="form-control" id="sdInput">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="saveScoreButton" type="button" class="btn btn-outline-primary">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript libraries-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/whs.js"></script>

<script type="text/javascript">

    $(document).ready(function () {

        displayAllResults();

        $('#saveScoreButton').click(function(){
            $("#scoreForm").modal('hide');
            var result = {};

            if ($('#dateInput').val().length == 0) {
                setAlert('Attenzione: data non valida');
                return;
            }
            result.date = new Date($('#dateInput').val());
            //trip.date = t_date.toLocaleDateString('it-IT', options);

            if ($('#courseInput').val().length == 0) {
                setAlert('Attenzione: nome del campo non valido');
                return;
            }
            result.course = $('#courseInput').val();

            if ($('#tournamentInput').val().length == 0) {
                setAlert('Attenzione: nome gara non valido');
                return;
            }
            result.tournament = $('#tournamentInput').val();

            if (($('#stbInput').val().length == 0) || (isNaN($('#stbInput').val()))){
                setAlert('Attenzione: risultato stableford non valido');
                return;
            }
            result.stb = parseInt($('#stbInput').val());

            if ($('#sdInput').val().length == 0) {
                setAlert('Attenzione: Score Differential non valido');
                return;
            }
            result.sd = parseFloat($('#sdInput').val());

            var results = JSON.parse(localStorage.getItem("whsResults") || "[]");
            addResultToTable(result, results.length);
            results.push(result);
            localStorage.setItem('whsResults', JSON.stringify(results));
        });

        $(document).on("click", ".delete_result", function () {
            var results = JSON.parse(localStorage.getItem("whsResults"));
            results.splice(this.dataset.id, 1);
            localStorage.setItem('whsResults', JSON.stringify(results));
            $(this).parent().remove();
        });

    });

</script>

</body>
</html>
